# EasyVoice Docker Compose
# 主服务一定部署；可选配音方案：OpenVoice（vc）/ RVC（rvc）/ XTTS 声音克隆（clone）/ OmniVoice 克隆（omnivoice）
#
# 【方式零：一键部署（主服务 + OpenVoice + RVC，推荐新手）】
#   Windows 双击 deploy.bat；Linux/macOS 执行 bash deploy.sh
#   等价于：docker compose --profile vc --profile rvc up -d --build
#   首次构建约 10-20 分钟（rvc-server 需源码编译）
#   RVC 模型不入库（体积原因）：自行下载放入 rvc-models/（见 rvc-models/README.txt）
#
# 【方式一：仅主服务（仅 Edge 预设配音）】
#   docker compose up -d --build
#
# 【方式二：只装一种配音方案】
#   OpenVoice 版：  docker compose --profile vc up -d --build
#   RVC 版：        docker compose --profile rvc up -d --build
#   OmniVoice 版：  docker compose --profile omnivoice up -d --build
#     （模型已预置进镜像，首次构建约 20-40 分钟、镜像约 8GB（CPU/GPU 通用）；CPU 可跑但合成较慢，推荐 GPU 机器）
#
# 【方式三：换声/克隆服务单独部署在另一台机器】
#   1. 服务机在仓库根目录单独构建运行（详见 README「方式 C」）：
#      vc-server       -> -p 9090:9090，挂载 voices/ 为 /app/references:ro
#      rvc-server      -> -p 9091:9091，挂载 rvc-models/ 为 /app/models
#      omnivoice-server-> -p 9092:9092，挂载 voices/ 为 /app/references:ro
#   2. 主服务所在机器的 .env 设置：
#      VC_SERVER_URL=http://服务机IP:9090
#      RVC_SERVER_URL=http://服务机IP:9091
#      OMNIVOICE_SERVER_URL=http://服务机IP:9092
#   3. docker compose up -d --build
#
# 【可选加项：XTTS 声音克隆】
#   docker compose --profile vc --profile rvc --profile clone up -d --build
#   首次启动 XTTS 另下载约 1.8GB 模型（已配 hf-mirror 加速）
#
# 提示：
# - `docker compose up -d` 想默认带可选服务时，在 .env 里设置 COMPOSE_PROFILES=vc,rvc
# - 声音克隆服务地址也可在页面「声音克隆」卡片中配置（页面配置优先级更高）
# - AI 模式（智能配音）需要 LLM：在 .env 填 OPENAI_API_KEY / OPENAI_BASE_URL / MODEL_NAME，
#   或部署后在页面「AI 模型配置」卡片填写（页面配置优先级更高）

services:
  easyvoice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easyvoice
    restart: unless-stopped
    ports:
      - '3000:3000'
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 容器内使用系统 ffmpeg（alpine 安装），不使用 ffmpeg-static 二进制
      - FFMPEG_PATH=/usr/bin/ffmpeg
      # 声音克隆服务地址：默认指向 compose 内的 xtts-server；
      # 独立部署克隆服务时在 .env 覆盖（如 TTS_CLONE_URL=http://192.168.1.10:8020）
      - TTS_CLONE_URL=${TTS_CLONE_URL:-http://xtts-server:8020}
      # 音色转换服务地址（openvoice 换声引擎）：默认指向 compose 内的 vc-server
      - VC_SERVER_URL=${VC_SERVER_URL:-http://vc-server:9090}
      # RVC 转换服务地址（rvc 换声引擎）：默认指向 compose 内的 rvc-server
      - RVC_SERVER_URL=${RVC_SERVER_URL:-http://rvc-server:9091}
      # OmniVoice 克隆合成服务地址（omnivoice 引擎）：默认指向 compose 内的 omnivoice-server
      - OMNIVOICE_SERVER_URL=${OMNIVOICE_SERVER_URL:-http://omnivoice-server:9092}
      # 克隆服务容器内看到的说话人目录（参考 wav 所在位置，随部署方式调整）
      - TTS_CLONE_SPEAKERS_DIR=${TTS_CLONE_SPEAKERS_DIR:-/app/speakers/custom-voices}
      # AI 配音规划用 LLM（也可在页面「AI 模型配置」卡片填写，优先级更高）
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-}
      # 速率限制（可选）
      - RATE_LIMIT=${RATE_LIMIT:-}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-}
    volumes:
      # 生成的有声书、章节音频、书籍状态持久化（宿主机目录映射，直观可见）
      - ./docker-data/audio:/app/audio
      # LLM/克隆服务配置持久化
      - ./docker-data/backend:/app/data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 克隆服务（xtts-server）为可选依赖（clone profile），不做启动顺序绑定：
    # 克隆调用发生在运行期且自带重试，未启用克隆时也不阻塞主服务启动

  # XTTS 声音克隆服务（可选）：加 --profile clone 启用，见文件头「方式二」
  xtts-server:
    image: daswer123/xtts-api-server:latest
    container_name: xtts-server
    restart: unless-stopped
    profiles: ['clone']
    ports:
      - '8020:8020'
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      # 国内网络模型下载加速；首次启动下载约 1.8GB
      - HF_ENDPOINT=https://hf-mirror.com
      - COQUI_TOS_AGREED=1
    volumes:
      # 模型缓存持久化（避免重建容器重复下载）
      - ./docker-data/xtts-models:/app/xtts_models
      # 说话人参考目录：挂载同一个 audio 目录，参考 wav 在 /app/speakers/custom-voices/
      - ./docker-data/audio:/app/speakers

  # 音色转换服务（可选）：加 --profile vc 启用。OpenVoice2 零样本换声，
  # 用 voices/ 里的参考音频对 Edge-TTS 合成结果做频谱重建（快，相似度中等）
  vc-server:
    build: ./vc-server
    container_name: vc-server
    restart: unless-stopped
    profiles: ['vc']
    ports:
      - '9090:9090'
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      # 参考音色：宿主机 voices/ 目录的 wav（文件名即参考名）
      - ./voices:/app/references:ro
      # 转换器权重持久化（首次启动从 hf-mirror 下载）
      - ./docker-data/vc-checkpoints:/app/checkpoints_v2

  # RVC v2 音色转换服务（可选）：加 --profile rvc 启用。
  # 独立于 vc-server 部署（RVC 依赖链较老，隔离避免影响 OpenVoice 服务）。
  # 模型放置：宿主机 rvc-models/<模型名>/xx.pth（+ 可选 xx.index），社区模型或自训均可
  rvc-server:
    build: ./rvc-server
    container_name: rvc-server
    restart: unless-stopped
    profiles: ['rvc']
    ports:
      - '9091:9091'
    # torch 进程较重：限制内存防止拖垮 Docker 虚拟机（模型缓存本身有 LRU 上限）
    mem_limit: 4g
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - RVC_MODEL_CACHE=2
    volumes:
      # RVC 模型：每个音色一个子目录（xx.pth + 可选 xx.index）
      - ./rvc-models:/app/models
      # RVC hubert/rmvpe 基础模型缓存持久化（首次推理从 hf-mirror 下载）
      - ./docker-data/rvc-hf-cache:/root/.cache/huggingface

  # OmniVoice 零样本声音克隆服务（可选）：加 --profile omnivoice 启用。
  # 文本+参考音频一步合成（不能对已有音频换声）：绑定了换声源的角色直接克隆合成，
  # 未绑定的角色（如旁白）仍走 Edge 预设音色。模型已预置进镜像，运行期零下载。
  # 参考音色与 OpenVoice 共用宿主机 voices/ 目录（wav 文件名即换声源名）。
  omnivoice-server:
    build:
      context: ./omnivoice-server
      args:
        # GPU 加速：.env 设 TORCH_BUILD=cu126（默认 cpu）；配合 docker-compose.gpu.yml 使用
        TORCH_BUILD: ${TORCH_BUILD:-cpu}
    container_name: omnivoice-server
    restart: unless-stopped
    profiles: ['omnivoice']
    ports:
      - '9092:9092'
    # 约 0.8B 模型 fp32 常驻约 4GB（编码参考音频时另加载 Whisper）：限制内存防止拖垮 Docker 虚拟机
    mem_limit: 6g
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      # auto = 有 CUDA 用 GPU，否则 CPU
      - OMNIVOICE_DEVICE=auto
      # 扩散解码步数：CPU 建议 16（约为 32 步速度的两倍，质量损失很小）；
      # GPU 机器可在 .env 设 OMNIVOICE_NUM_STEP=32 提升质量
      - OMNIVOICE_NUM_STEP=${OMNIVOICE_NUM_STEP:-16}
      # 参考音频自动转写模型（每个参考仅首次编码时运行一次；镜像内已预置 whisper-small）
      - OMNIVOICE_ASR_MODEL=openai/whisper-small
    volumes:
      # 参考音色：与 vc-server 共用宿主机 voices/ 目录（换声源跨引擎通用）。
      # 需要写权限：音色设计页保存的 Omni 声纹样本也写入这里
      - ./voices:/app/references
      # 参考音频编码结果缓存（含首次自动转写）：重建容器/换参考后不重跑 ASR
      - ./docker-data/omnivoice-prompts:/app/prompts
      # HF 模型缓存：预下载（download-models 脚本）或容器首次启动自动下载，持久化避免重复下载
      - ./docker-data/omnivoice-models/hf:/root/.cache/huggingface
