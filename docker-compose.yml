# EasyVoice Docker Compose
# 一份文件支持三种部署方式（通过 profiles 与 .env 覆盖自由组合）：
#
# 【方式一：仅主服务（不含声音克隆）】
#   docker compose up -d --build
#   访问 http://localhost:3000；声音克隆功能不可用，其余功能完整
#
# 【方式二：主服务 + 内置 XTTS 克隆服务（推荐）】
#   docker compose --profile clone up -d --build
#   首次启动 XTTS 会下载约 1.8GB 模型（已配 hf-mirror 加速）
#
# 【方式三：主服务 + 独立部署的克隆服务（另一台机器/GPU 机器）】
#   1. 克隆机单独运行 XTTS，并共享本机 audio 目录（目录内 custom-voices/ 为参考音频）：
#      docker run -d -p 8020:8020 --restart unless-stopped \
#        -v /本机路径/easyVoice/packages/backend/audio:/app/speakers \
#        -e HF_ENDPOINT=https://hf-mirror.com -e COQUI_TOS_AGREED=1 \
#        daswer123/xtts-api-server:latest
#   2. 在根目录 .env 中设置（克隆服务不是本机时，参考音频目录需自行同步）：
#      TTS_CLONE_URL=http://克隆机IP:8020
#      TTS_CLONE_SPEAKERS_DIR=/app/speakers/custom-voices
#   3. docker compose up -d --build
#
# 提示：
# - `docker compose up -d` 想默认带上 XTTS 时，在 .env 里设置 COMPOSE_PROFILES=clone 即可
# - 声音克隆服务地址也可在页面「声音克隆」卡片中配置（页面配置优先级更高）
# - AI 模式（智能配音）需要 LLM：在 .env 填 OPENAI_API_KEY / OPENAI_BASE_URL / MODEL_NAME，
#   或部署后在页面「AI 模型配置」卡片填写（页面配置优先级更高）

services:
  easyvoice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easyvoice
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 容器内使用系统 ffmpeg（alpine 安装），不使用 ffmpeg-static 二进制
      - FFMPEG_PATH=/usr/bin/ffmpeg
      # 声音克隆服务地址：默认指向 compose 内的 xtts-server；
      # 独立部署克隆服务时在 .env 覆盖（如 TTS_CLONE_URL=http://192.168.1.10:8020）
      - TTS_CLONE_URL=${TTS_CLONE_URL:-http://xtts-server:8020}
      # 音色转换服务地址（openvoice 换声引擎）：默认指向 compose 内的 vc-server
      - VC_SERVER_URL=${VC_SERVER_URL:-http://vc-server:9090}
      # RVC 转换服务地址（rvc 换声引擎）：默认指向 compose 内的 rvc-server
      - RVC_SERVER_URL=${RVC_SERVER_URL:-http://rvc-server:9091}
      # 克隆服务容器内看到的说话人目录（参考 wav 所在位置，随部署方式调整）
      - TTS_CLONE_SPEAKERS_DIR=${TTS_CLONE_SPEAKERS_DIR:-/app/speakers/custom-voices}
      # AI 配音规划用 LLM（也可在页面「AI 模型配置」卡片填写，优先级更高）
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-}
      # 速率限制（可选）
      - RATE_LIMIT=${RATE_LIMIT:-}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-}
    volumes:
      # 生成的有声书、章节音频、书籍状态持久化
      - easyvoice-audio:/app/audio
      # LLM/克隆服务配置持久化
      - easyvoice-data:/app/data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 克隆服务（xtts-server）为可选依赖（clone profile），不做启动顺序绑定：
    # 克隆调用发生在运行期且自带重试，未启用克隆时也不阻塞主服务启动

  # XTTS 声音克隆服务（可选）：加 --profile clone 启用，见文件头「方式二」
  xtts-server:
    image: daswer123/xtts-api-server:latest
    container_name: xtts-server
    restart: unless-stopped
    profiles: ['clone']
    ports:
      - '8020:8020'
    environment:
      # 国内网络模型下载加速；首次启动下载约 1.8GB
      - HF_ENDPOINT=https://hf-mirror.com
      - COQUI_TOS_AGREED=1
    volumes:
      # 模型缓存持久化（避免重建容器重复下载）
      - xtts-models:/app/xtts_models
      # 说话人参考目录：挂载整个 audio 卷，参考 wav 在 /app/speakers/custom-voices/
      - easyvoice-audio:/app/speakers

  # 音色转换服务（可选）：加 --profile vc 启用。OpenVoice2 零样本换声，
  # 用 voices/ 里的参考音频对 Edge-TTS 合成结果做频谱重建（快，相似度中等）
  vc-server:
    build: ./vc-server
    container_name: vc-server
    restart: unless-stopped
    profiles: ['vc']
    ports:
      - '9090:9090'
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      # 参考音色：宿主机 voices/ 目录的 wav（文件名即参考名）
      - ./voices:/app/references:ro
      # 转换器权重持久化（首次启动从 hf-mirror 下载）
      - vc-checkpoints:/app/checkpoints_v2

  # RVC v2 音色转换服务（可选）：加 --profile rvc 启用。
  # 独立于 vc-server 部署（RVC 依赖链较老，隔离避免影响 OpenVoice 服务）。
  # 模型放置：宿主机 rvc-models/<模型名>/xx.pth（+ 可选 xx.index），社区模型或自训均可
  rvc-server:
    build: ./rvc-server
    container_name: rvc-server
    restart: unless-stopped
    profiles: ['rvc']
    ports:
      - '9091:9091'
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      # RVC 模型：每个音色一个子目录（xx.pth + 可选 xx.index）
      - ./rvc-models:/app/models
      # RVC hubert/rmvpe 基础模型缓存持久化（首次推理从 hf-mirror 下载）
      - rvc-hf-cache:/root/.cache/huggingface

volumes:
  easyvoice-audio:
  easyvoice-data:
  xtts-models:
  vc-checkpoints:
  rvc-hf-cache:
