# EasyVoice Docker Compose
# 包含：EasyVoice 主服务（本地构建，含有声书/克隆/情感全部功能）+ XTTS 声音克隆服务
#
# 启动：  docker compose up -d --build
# 访问：  http://localhost:3000
#
# AI 模式（智能配音）需要 LLM：在根目录 .env 填 OPENAI_API_KEY / OPENAI_BASE_URL / MODEL_NAME
# 声音克隆：页面上传参考音频后即可试听/生成（XTTS 服务由本 compose 提供）
#
# 如只需快速跑官方镜像（不含克隆等新功能）：
#   docker run -d -p 3000:3000 -v ./audio:/app/audio cosincox/easyvoice:latest

services:
  easyvoice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easyvoice
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 容器内使用系统 ffmpeg（alpine 安装），不使用 ffmpeg-static 二进制
      - FFMPEG_PATH=/usr/bin/ffmpeg
      # 声音克隆服务（daswer123/xtts-api-server），compose 网络内服务名直连
      - TTS_CLONE_URL=http://xtts-server:8020
      - TTS_CLONE_SPEAKERS_DIR=/app/speakers
      # AI 配音规划用 LLM（也可在页面「AI 模型配置」卡片填写，优先级更高）
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-}
      # 速率限制（可选）
      - RATE_LIMIT=${RATE_LIMIT:-}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-}
    volumes:
      # 生成的有声书、章节音频、书籍状态持久化
      - easyvoice-audio:/app/audio
      # LLM/克隆服务配置持久化
      - easyvoice-data:/app/data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - xtts-server

  xtts-server:
    image: daswer123/xtts-api-server:latest
    container_name: xtts-server
    restart: unless-stopped
    ports:
      - '8020:8020'
    environment:
      # 国内网络模型下载加速；首次启动下载约 1.8GB
      - HF_ENDPOINT=https://hf-mirror.com
      - COQUI_TOS_AGREED=1
    volumes:
      # 模型缓存持久化（避免重建容器重复下载）
      - xtts-models:/app/xtts_models
      # 说话人参考目录：挂载整个 audio 卷，参考 wav 在 /app/speakers/custom-voices/
      - easyvoice-audio:/app/speakers

volumes:
  easyvoice-audio:
  easyvoice-data:
  xtts-models:
